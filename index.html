<body><div class="app" id="app"><header><div><h1>🪐 公民 3D 知識星球</h1><small>第 5 章｜所有權的物權特性｜依教材第 109–115 頁設計</small></div><div class="inline-actions"><label class="switch"><input id="teacherToggle" type="checkbox"> 教師模式</label><button class="btn" id="tourBtn">🎥 鏡頭導覽</button><button class="btn" id="resetCameraBtn">⌖ 重設鏡頭</button></div></header><main class="layout"><aside class="side left"><h2 class="title">🧭 知識區域</h2><div class="hint">點擊 3D 建築或選取區域。完成一項任務，就能解鎖下一站。</div><div id="zoneNav" style="display:contents"></div></aside><section class="scene" id="scene" aria-label="可旋轉的 3D 知識星球"><div id="labels" class="labels"></div><div class="top-scene"><button class="btn" id="leftBtn" aria-label="向左轉">↶</button><button class="btn" id="rightBtn" aria-label="向右轉">↷</button><button class="btn" id="zoomIn" aria-label="放大">＋</button><button class="btn" id="zoomOut" aria-label="縮小">－</button></div><div class="scene-help">🖱️ 拖曳旋轉｜滾輪縮放｜點擊建築進入關卡｜觸控可單指旋轉、雙指縮放</div></section><aside class="side right" id="details"><h2 class="title">📚 任務探索站</h2><div id="taskPanel"></div></aside></main><footer><div>探索進度：<strong id="progressCount">0 / 6</strong>　<span class="muted" id="status">請探索第 1 站</span></div><div style="min-width:110px;flex:0 1 220px" class="progress-track"><div id="progressFill" class="progress-fill"></div></div><div><button class="btn" id="downloadBtn">⬇ 匯出學習歷程</button><button class="btn" id="restartBtn">重置進度</button></div></footer></div><div id="toast" role="status" aria-live="polite"></div>
<script type="module">

const ZONES=[
{id:'basics',icon:'🌐',name:'所有權中心',sub:'權利主體與權利客體',color:0x74b9fa,lat:65,lon:0,kind:'hall',pages:'109–110',goal:'分辨所有權、動產與不動產，理解占有、使用、收益、處分。',concept:'民法以人為權利主體，以物為權利客體。所有權人原則上得使用、收益、處分所有物，並排除他人干涉。土地與其定著物如房屋屬不動產；手機與電腦屬動產。',caseText:'小辰擁有電腦，他有權決定自己使用、借人使用或出售，但仍須遵守法律。',question:'下列何者依教材屬於不動產？',options:['手機','房屋','電腦','腳踏車'],correct:1,explain:'房屋是附著在土地上的定著物，屬不動產；其他選項屬動產。',teacher:'第 1 節 0–12 分鐘：由學生說明自己的物品如何使用、收益或處分，再比較權利主體與客體。提醒所有權並非不受限制。',discussion:'借用別人的電腦很久，就會自動成為所有權人嗎？說明你的理由。'},
{id:'traits',icon:'🏛️',name:'物權特性學院',sub:'四大特性',color:0xffcd6b,lat:54,lon:70,kind:'school',pages:'111–112',goal:'能指出直接支配性、保護絕對性、排他性與優先性。',concept:'直接支配性：所有人得直接支配其物。保護絕對性：得對任何人主張所有權。排他性：一物不會同時有兩個獨立所有權，但得由數人共有。優先性：除法律另有規定，同一物之所有權原則上優先於債權。',caseText:'小辰先答應以 5,000 元賣電腦給元元，後又以 6,000 元賣給阿庭並交付。教材案例中阿庭取得所有權，元元不能主張自己是所有人。',question:'一臺電腦由數人共同擁有同一所有權，最能說明何種情況？',options:['排他性不適用','共有','同時存在多個所有權','債權即所有權'],correct:1,explain:'排他性不禁止共有；共有是數人共享同一所有權。',teacher:'第 1 節 12–32 分鐘：用四個情境分組配對四大特性。教材優先性案例以已完成動產交付、取得物權為前提，避免誤教為所有買賣契約均無保障。',discussion:'若元元因小辰反悔受損，可從契約權利角度如何思考？不要把債權誤認為所有權。'},
{id:'remedies',icon:'🛡️',name:'權利保障法院',sub:'民法第 767 條',color:0x61e1c5,lat:50,lon:145,kind:'court',pages:'113',goal:'在具體情境中區辨返還、除去妨害、防止妨害三種請求。',concept:'民法第 767 條：對無權占有或侵奪所有物者，可請求返還；對已發生之所有權妨害，可請求除去；對有妨害之虞者，可請求防止。',caseText:'朋友無權扣留小辰電腦，可考慮返還請求；有人已妨害使用，可考慮除去妨害；有明確妨害風險，則可考慮防止妨害。',question:'他人尚未動手，但已有明確妨害所有權的危險，適合主張哪一項？',options:['所有物返還請求','妨害防止請求','直接取得對方財產','物權法定主義'],correct:1,explain:'「有妨害之虞」是防止妨害請求權的核心要件。',teacher:'第 1 節 32–50 分鐘：以「已拿走、已妨害、可能妨害」分類。強調適用條件與個案法律判斷。',discussion:'有人擅自占用你的腳踏車，你會先蒐集哪些證據？'},
{id:'registry',icon:'🏠',name:'財產登記所',sub:'物權法定與公示',color:0xffa6aa,lat:52,lon:215,kind:'house',pages:'114',goal:'比較動產交付與不動產登記，以及物權法定主義。',concept:'物權除依法律或習慣外，不得創設，稱物權法定主義。教材說明：一般動產讓與原則上以交付為公示方式；依法律行為取得或移轉不動產物權，原則上須登記才生效。',caseText:'陳太太與林先生簽好房屋買賣契約後，仍須辦理所有權移轉登記，才能完成此種不動產物權的移轉。',question:'依教材案例，房屋買賣契約簽訂後，移轉房屋所有權通常還需要什麼？',options:['只要口頭同意','移轉登記','把鑰匙拍照','任何人見證就行'],correct:1,explain:'教材依民法第 758 條說明，因法律行為移轉不動產物權，原則上須登記生效。',teacher:'第 2 節 0–18 分鐘：讓學生比較手機交易與房屋交易，畫出契約、交付、登記的流程，並指出本單元描述的是原則，法律另有規定時須另行判斷。',discussion:'為何不動產登記制度能降低買賣風險？'},
{id:'public',icon:'🌳',name:'公共利益公園',sub:'所有權與社會責任',color:0xb8e779,lat:59,lon:285,kind:'park',pages:'110、114–115',goal:'能以環境污染、騎樓通行說明財產權並非無限。',concept:'憲法第 15 條保障財產權，但私有財產應與公共利益調和。教材以河川污染、建築騎樓行人通行等事例，思考法律為何需要適度限制所有權。',caseText:'若有人在土地上排放廢水造成河川污染，不能僅以「這是我的土地」免除公共利益與法律規範的考量。',question:'哪一項最符合教材對財產權與公共利益的觀點？',options:['所有人可毫無限制行使權利','財產權一律不受保障','保障財產權，也可依法為公共利益適度限制','政府可不經程序任意沒收'],correct:2,explain:'財產權受保障，但並非絕對；限制仍須具有法律依據並遵守正當程序。',teacher:'第 2 節 18–35 分鐘：分組模擬居民、業者與政府，討論污染防治及騎樓通行，練習同理與公共利益衡量。',discussion:'環保與業者財產利用發生衝突時，你會提出哪兩項兼顧方案？'},
{id:'ip',icon:'💡',name:'智慧財產實驗室',sub:'創作與合理使用',color:0xc9a8ff,lat:68,lon:335,kind:'lab',pages:'115',goal:'思辨智慧財產權、創作者利益、合理使用與知識分享。',concept:'教材討論智慧財產權保障創作，也可能產生知識傳播的限制；須調和公共利益，並介紹開放原始碼運動。智慧財產權與有形物所有權應區別理解。',caseText:'學校想使用他人的圖片製作教材，應思考授權、合理使用的要件與使用方式，不能直接假設教育用途全部免授權。',question:'哪個做法最能兼顧創作權利與知識分享？',options:['所有作品都可任意重製','完全禁止任何合理使用','確認授權條件並評估合理使用','只要是網路圖片就沒有著作權'],correct:2,explain:'確認授權與法定合理使用條件，較能兼顧創作者及社會公共利益。',teacher:'第 2 節 35–50 分鐘：以班級教材圖片與開源軟體議題進行短辯論，最後學生提交個人反思並匯出歷程。',discussion:'如果你創作了教學影片，會選擇何種分享授權？為什麼？'}
];
const KEY='ownership-planet-progress-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch{};state=state&&Array.isArray(state.done)?state:{done:[],answers:{},reflections:{},events:[],student:'',created:new Date().toISOString()};let chosen=0,attempted=false;const $=s=>document.querySelector(s);const sceneEl=$('#scene');const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){console.warn(e)}};const event=(type,zone,detail='')=>{state.events.push({time:new Date().toISOString(),type,zone,detail});save()};const toast=s=>{let t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2500)};const isUnlocked=i=>i===0||state.done.includes(ZONES[i-1].id)||state.done.includes(ZONES[i].id);const renderNav=()=>{$('#zoneNav').innerHTML=ZONES.map((z,i)=>`<button class="zone ${i===chosen?'active':''} ${!isUnlocked(i)?'locked':''}" data-zone="${i}"><span class="symbol">${isUnlocked(i)?z.icon:'🔒'}</span><span><strong>${i+1}. ${z.name}</strong><small>${state.done.includes(z.id)?'✅ 任務完成':isUnlocked(i)?z.sub:'完成前一站解鎖'}</small></span></button>`).join('');document.querySelectorAll('[data-zone]').forEach(el=>el.addEventListener('click',()=>selectZone(+el.dataset.zone)))};
function renderPanel(){const z=ZONES[chosen],done=state.done.includes(z.id);$('#taskPanel').innerHTML=`<div class="panel"><span class="badge">第 ${chosen+1} / 6 站 · 教材頁碼 ${z.pages}</span><h3>${z.icon} ${z.name}</h3><div class="objective"><strong>🎯 學習目標</strong><br>${z.goal}</div><p><strong>📖 概念速讀</strong><br>${z.concept}</p><p><strong>🎭 案例情境</strong><br>${z.caseText}</p><div class="teacher teacher-notes"><strong>👩‍🏫 教師引導</strong><br>${z.teacher}</div></div><div class="panel" id="taskCard"><h3>🧩 學生任務</h3><p class="question">${z.question}</p><div id="answers">${z.options.map((o,i)=>`<button class="answer" data-answer="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><div id="feedback"></div>${done?'<div class="feedback">✅ 本關已通過，可隨時複習與重新作答。</div>':''}<p><strong>💭 反思問題</strong><br>${z.discussion}</p><label for="reflection">寫下你的判斷、理由或行動建議</label><textarea id="reflection" rows="4" style="width:100%;padding:12px;background:#102741;color:white;border:1px solid #617b9d;border-radius:10px;font-size:16px;margin-top:6px" placeholder="請以自己的話作答……"></textarea><div class="inline-actions"><button class="btn" id="saveReflection">儲存反思</button><button class="btn primary" id="nextZone" ${!done?'disabled':''}>${chosen===5?'完成星球探索':'前往下一站 →'}</button></div></div>`;$('#reflection').value=state.reflections[z.id]||'';$('#saveReflection').onclick=()=>{state.reflections[z.id]=$('#reflection').value;event('reflection',z.id,'儲存學生反思');toast('已儲存反思')};$('#nextZone').onclick=()=>{if(chosen<5)selectZone(chosen+1);else toast('恭喜完成六大知識區！可以匯出學習歷程')};document.querySelectorAll('[data-answer]').forEach(btn=>btn.onclick=()=>submitAnswer(+btn.dataset.answer));const old=state.answers[z.id];if(old)$('#feedback').innerHTML=`<p class="feedback">最近一次作答：${old.correct?'✅ 正確':'尚未答對'}。${z.explain}</p>`}
function submitAnswer(n){const z=ZONES[chosen];let correct=n===z.correct;state.answers[z.id]={choice:n,correct,time:new Date().toISOString()};event('answer',z.id,correct?'correct':'incorrect');document.querySelectorAll('[data-answer]').forEach((el,i)=>{el.classList.toggle('correct',i===z.correct);el.classList.toggle('wrong',i===n&&!correct)});$('#feedback').innerHTML=`<p class="feedback">${correct?'✅ 答對了！':'❌ 再想想。'} ${z.explain}</p>`;if(correct&&!state.done.includes(z.id)){state.done.push(z.id);event('unlock',z.id,'完成關卡');toast('🎉 闖關成功，下一區域已解鎖！');renderNav();updateProgress();renderPanel()}else if(correct){renderPanel()} }
function updateProgress(){$('#progressCount').textContent=state.done.length+' / 6';$('#progressFill').style.width=(state.done.length/6*100)+'%';$('#status').textContent=state.done.length===6?'六大關卡全部完成！':`已開放 ${Math.min(6,state.done.length+1)} 個學習區域`;renderLabels()}
